name: ci

on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Hygiene check
        run: python scripts/check_hygiene.py --all
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - name: Offline demo
        run: |
          if [ -f gate/demo.py ]; then
            python -m gate demo --offline
          fi
      - name: Gate code hash
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate codehash res/gate.wasm
          fi
      - name: Gate wasm exports
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate wasm-exports res/gate.wasm
          fi
      - name: Registry wasm exports
        run: |
          if [ -f res/registry.wasm ]; then
            python -m gate wasm-exports res/registry.wasm
          fi
      - name: Verify registry fixtures
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate verify fixtures/registry/sample-allow.json fixtures/registry/sample-allow-evidence.json
            python -m gate verify fixtures/registry/testnet-vendor.json fixtures/evidence/7e77187d*.json
          fi

  rust-unit:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/shieldbot-near-target
    strategy:
      matrix:
        crate: [gate, test-token, test-attest-mock, registry, reports]
    steps:
      - uses: actions/checkout@v4
      - name: Select repository toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            /tmp/shieldbot-near-target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Unit tests
        working-directory: contracts/${{ matrix.crate }}
        run: cargo test --lib

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: /tmp/shieldbot-near-target
    strategy:
      fail-fast: false
      matrix:
        crate: [gate, registry, reports]
    steps:
      - uses: actions/checkout@v4
      - name: Select repository toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            /tmp/shieldbot-near-target
          key: ${{ runner.os }}-cargo-sandbox-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-near
        run: |
          if ! command -v cargo-near; then
            sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
            cargo install cargo-near --version 0.22.0 --locked
          fi
      - name: Sandbox tests
        working-directory: contracts/${{ matrix.crate }}
        run: cargo test --test sandbox

  reproducible:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [gate, registry, reports]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the build record
        id: record
        run: |
          set -euo pipefail
          record="res/BUILD-$CRATE.md"
          wasm="res/$CRATE.wasm"
          test "$(grep -c '^Source commit: ' "$record")" -eq 1
          source_commit=$(sed -n 's/^Source commit: //p' "$record")
          if [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            if [[ ! -f "$wasm" ]]; then
              printf '%s records source commit %s but %s is absent\n' "$record" "$source_commit" "$wasm"
              exit 1
            fi
            printf 'state=build\nsource_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          elif [[ "$source_commit" == TBD* ]]; then
            if [[ -f "$wasm" ]]; then
              printf '%s says the source commit is TBD but %s is present\n' "$record" "$wasm"
              exit 1
            fi
            printf 'skipped: %s says the source commit is TBD and %s is absent, so there is no artifact to rebuild\n' "$record" "$wasm"
            printf 'state=skip\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s has a source commit that is neither 40 hex nor TBD: %s\n' "$record" "$source_commit"
            exit 1
          fi
      - name: Select repository toolchain
        if: steps.record.outputs.state == 'build'
        run: rustup show
      - uses: actions/cache@v4
        if: steps.record.outputs.state == 'build'
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-reproducible-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-near
        if: steps.record.outputs.state == 'build'
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          cargo install cargo-near --version 0.22.0 --locked
      - name: Check out artifact source commit
        if: steps.record.outputs.state == 'build'
        run: git worktree add --detach "$RUNNER_TEMP/repro-source" "${{ steps.record.outputs.source_commit }}"
      - name: Build reproducibly
        if: steps.record.outputs.state == 'build'
        working-directory: ${{ runner.temp }}/repro-source/contracts/${{ matrix.crate }}
        run: cargo near build reproducible-wasm
      - name: Compare wasm hash
        if: steps.record.outputs.state == 'build'
        run: |
          set -euo pipefail
          built=$(sha256sum "$RUNNER_TEMP/repro-source/contracts/$CRATE/target/near/$CRATE.wasm" | awk '{print $1}')
          committed=$(awk 'NR == 1 {print $1}' "res/$CRATE.wasm.sha256")
          test "$built" = "$committed"
          printf '%s %s\n' "$CRATE" "$built"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository hygiene
        run: python scripts/check_hygiene.py --all
      - name: Private key history scan
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/history.patch"
          git log --all -p > "$log_file"
          test -s "$log_file"
          if count=$(grep -Eic 'ed25519:[1-9A-HJ-NP-Za-km-z]{80,}|"(secret_key|private_key)"[[:space:]]*:[[:space:]]*"[^"]+"|BEGIN [A-Z ]*PRIVATE KEY' "$log_file"); then
            :
          else
            status=$?
            test "$status" -eq 1
          fi
          printf '%s\n' "$count"
          test "$count" -eq 0
