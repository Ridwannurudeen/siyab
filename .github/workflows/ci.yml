name: ci

on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Hygiene check
        run: python scripts/check_hygiene.py --all
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - name: Offline demo
        run: |
          if [ -f gate/demo.py ]; then
            python -m gate demo --offline
          fi
      - name: Gate code hash
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate codehash res/gate.wasm
          fi
      - name: Gate wasm exports
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate wasm-exports res/gate.wasm
          fi
      - name: Registry wasm exports
        run: |
          if [ -f res/registry.wasm ]; then
            python -m gate wasm-exports res/registry.wasm
          fi
      - name: Verify registry fixtures
        run: |
          if [ -f res/gate.wasm ]; then
            python -m gate verify fixtures/registry/sample-allow.json fixtures/registry/sample-allow-evidence.json
            python -m gate verify fixtures/registry/testnet-vendor.json fixtures/evidence/7e77187d*.json
          fi

  rust-unit:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/shieldbot-near-target
    strategy:
      matrix:
        crate: [gate, test-token, registry]
    steps:
      - uses: actions/checkout@v4
      - name: Select repository toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ${{ runner.temp }}/shieldbot-near-target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Unit tests
        working-directory: contracts/${{ matrix.crate }}
        run: cargo test --lib

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/shieldbot-near-target
    strategy:
      matrix:
        crate: [gate, registry]
    steps:
      - uses: actions/checkout@v4
      - name: Select repository toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ${{ runner.temp }}/shieldbot-near-target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Sandbox tests
        working-directory: contracts/${{ matrix.crate }}
        run: cargo test --test sandbox

  reproducible:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/shieldbot-near-target
    steps:
      - uses: actions/checkout@v4
      - name: Select repository toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ${{ runner.temp }}/shieldbot-near-target
          key: ${{ runner.os }}-cargo-reproducible-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-near
        run: cargo install cargo-near --version 0.22.0 --locked
      - name: Build gate reproducibly
        working-directory: contracts/gate
        run: cargo near build reproducible-wasm --out-dir ../../res
      - name: Build registry reproducibly
        working-directory: contracts/registry
        run: cargo near build reproducible-wasm --out-dir ../../res
      - name: Compare wasm hashes
        run: sha256sum -c res/gate.wasm.sha256 res/registry.wasm.sha256

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository hygiene
        run: python scripts/check_hygiene.py --all
      - name: Private key history scan
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/history.patch"
          git log --all -p > "$log_file"
          test -s "$log_file"
          if count=$(grep -Eic 'ed25519:[1-9A-HJ-NP-Za-km-z]{80,}|"(secret_key|private_key)"[[:space:]]*:[[:space:]]*"[^"]+"|BEGIN [A-Z ]*PRIVATE KEY' "$log_file"); then
            :
          else
            status=$?
            test "$status" -eq 1
          fi
          printf '%s\n' "$count"
          test "$count" -eq 0
