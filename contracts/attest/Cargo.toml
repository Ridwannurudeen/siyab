[package]
name = "attest"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Ridwannurudeen/siyab.git"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
hex = "0.4"
near-sdk = "=5.29.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tee-verifier-interface = { git = "https://github.com/near/mpc", tag = "3.18.0", features = ["serde"] }

[dev-dependencies]
base64 = "0.22"
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
serde_json = "1"
near-workspaces = { version = "=0.23.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
