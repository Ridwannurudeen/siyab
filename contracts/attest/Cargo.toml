[package]
name = "attest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
borsh = { version = "1.6.1", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tee-verifier-interface = { git = "https://github.com/near/mpc", tag = "3.18.0", features = ["serde"] }

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
serde_json = "1"
near-workspaces = { version = "=0.23.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
