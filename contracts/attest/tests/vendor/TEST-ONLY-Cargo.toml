[workspace]
resolver = "3"
members = ["crates/tee-verifier", "crates/tee-verifier-interface", "crates/tee-verifier-conversions"]

[workspace.package]
version = "3.18.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/near/mpc"

[workspace.dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
dcap-qvl = { version = "=0.7.0", default-features = false, features = ["contract", "borsh", "std", "ring", "default-x509", "json-core"] }
derive_more = { version = "=2.1.1", features = ["as_ref", "constructor", "deref", "deref_mut", "display", "from", "from_str", "into"] }
getrandom = "=0.2.17"
near-sdk = { version = "=5.30.0", features = ["unstable"] }
tee-verifier-conversions = { path = "crates/tee-verifier-conversions" }
tee-verifier-interface = { path = "crates/tee-verifier-interface" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("abi"))'] }

[workspace.lints.clippy]
assertions_on_result_states = "warn"
allow_attributes = "warn"
mod_module_files = "deny"
wildcard_imports = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release-contract]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
